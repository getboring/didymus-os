name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval hosts (no KVM)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Require committed lock
        run: test -f flake.lock

      - name: Evaluate physical and QEMU hosts
        run: |
          set -euo pipefail
          nix eval .#nixosConfigurations.didymus-lab.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.qemu-lab.config.system.build.toplevel.drvPath

  nix:
    name: NixOS VM test and QEMU closure
    runs-on: ubuntu-24.04
    needs: eval
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      # `nix flake check` builds checks.x86_64-linux.didymus-lab, which boots a
      # VM. That needs /dev/kvm; a runner without it fails here rather than
      # silently skipping the twin assertions.
      - name: Require KVM
        run: test -e /dev/kvm

      - name: Flake check (includes NixOS VM test)
        run: nix flake check -L --show-trace

      - name: Build QEMU VM closure
        run: nix build .#qemu-vm -L
